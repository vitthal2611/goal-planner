<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Track UI - Mock Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f8f9fa;
    }

    .quick-track {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
      background: #f8f9fa;
      min-height: 100vh;
    }

    .top-bar {
      margin-bottom: 16px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .profile-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border: none;
      color: white;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
      flex-shrink: 0;
    }

    .profile-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }

    .profile-btn:active {
      transform: scale(0.95);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 20px;
      padding: 24px;
      max-width: 480px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    .modal-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 2px solid #e5e7eb;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 16px;
      border: none;
      background: transparent;
      font-size: 15px;
      font-weight: 600;
      color: #6b7280;
      cursor: pointer;
      transition: all 0.2s;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
    }

    .tab-btn:hover {
      color: #3b82f6;
    }

    .tab-btn.active {
      color: #3b82f6;
      border-bottom-color: #3b82f6;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 700;
      color: #1f2937;
    }

    .close-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: #f3f4f6;
      border-radius: 8px;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.2s;
      color: #6b7280;
    }

    .close-btn:hover {
      background: #e5e7eb;
    }

    .modal-section {
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: #1f2937;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .payment-method-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .payment-method-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #f9fafb;
      border-radius: 12px;
    }

    .payment-method-name {
      font-size: 16px;
      font-weight: 600;
      color: #1f2937;
    }

    .delete-btn {
      padding: 6px 12px;
      border: none;
      background: #fee2e2;
      color: #dc2626;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .delete-btn:hover {
      background: #fecaca;
    }

    .add-payment-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .add-payment-row {
      display: flex;
      gap: 8px;
    }

    .add-payment-input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 16px;
      transition: all 0.2s;
    }

    .add-payment-input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .add-btn {
      padding: 12px 20px;
      border: none;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
    }

    .add-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }

    .add-btn:active {
      transform: translateY(0);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1f2937;
      color: white;
      padding: 16px 24px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      z-index: 2000;
      opacity: 0;
      transition: all 0.3s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast.success {
      background: linear-gradient(135deg, #10b981, #059669);
    }

    .toast.error {
      background: linear-gradient(135deg, #ef4444, #dc2626);
    }

    .year-selector {
      display: flex;
      align-items: center;
      gap: 8px;
      background: white;
      padding: 12px 16px;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      flex: 0 0 auto;
    }

    .year-nav {
      width: 36px;
      height: 36px;
      border: none;
      background: #f3f4f6;
      border-radius: 8px;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.2s;
      color: #374151;
      font-weight: bold;
    }

    .year-nav:hover {
      background: #e5e7eb;
    }

    .year-nav:active {
      transform: scale(0.95);
    }

    .year-select {
      border: none;
      background: transparent;
      font-size: 16px;
      font-weight: 600;
      color: #1f2937;
      text-align: center;
      cursor: pointer;
      outline: none;
      width: 80px;
    }

    .month-selector {
      display: flex;
      align-items: center;
      gap: 8px;
      background: white;
      padding: 12px 16px;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      flex: 1;
    }

    .month-nav {
      width: 36px;
      height: 36px;
      border: none;
      background: #f3f4f6;
      border-radius: 8px;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.2s;
      color: #374151;
      font-weight: bold;
    }

    .month-nav:hover {
      background: #e5e7eb;
    }

    .month-nav:active {
      transform: scale(0.95);
    }

    .month-select {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 16px;
      font-weight: 600;
      color: #1f2937;
      text-align: center;
      cursor: pointer;
      outline: none;
    }

    .payment-balances-wrapper {
      background: white;
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      margin-bottom: 12px;
    }

    .payment-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      cursor: pointer;
      user-select: none;
    }

    .payment-title {
      font-size: 14px;
      font-weight: 700;
      color: #1f2937;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .toggle-icon {
      font-size: 20px;
      color: #6b7280;
      transition: transform 0.3s;
    }

    .toggle-icon.collapsed {
      transform: rotate(-90deg);
    }

    .payment-balances {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      max-height: 200px;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }

    .payment-balances.collapsed {
      max-height: 0;
    }

    .payment-item {
      padding: 12px;
      border-radius: 12px;
      text-align: center;
    }

    .payment-item.hdfc {
      background: linear-gradient(135deg, #e0e7ff, #c7d2fe);
    }

    .payment-item.sbi {
      background: linear-gradient(135deg, #fce7f3, #fbcfe8);
    }

    .payment-item.cash {
      background: linear-gradient(135deg, #e0f2fe, #bae6fd);
    }

    .payment-item.transfer {
      background: linear-gradient(135deg, #dbeafe, #bfdbfe);
    }

    .payment-label {
      font-size: 11px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .payment-value {
      font-size: 18px;
      font-weight: 800;
      color: #1f2937;
    }

    .balance-summary-wrapper {
      background: white;
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      margin-bottom: 16px;
    }

    .balance-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      cursor: pointer;
      user-select: none;
    }

    .balance-title {
      font-size: 14px;
      font-weight: 700;
      color: #1f2937;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .balance-summary {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      max-height: 200px;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }

    .balance-summary.collapsed {
      max-height: 0;
    }

    .balance-item {
      padding: 12px;
      border-radius: 12px;
      text-align: center;
    }

    .balance-item.income {
      background: linear-gradient(135deg, #d1fae5, #a7f3d0);
    }

    .balance-item.expense {
      background: linear-gradient(135deg, #fee2e2, #fecaca);
    }

    .balance-item.net {
      background: linear-gradient(135deg, #fef3c7, #fde68a);
    }

    .balance-label {
      font-size: 12px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .balance-value {
      font-size: 20px;
      font-weight: 800;
      color: #1f2937;
    }

    .quick-track-header {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .type-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 20px;
      border: 2px solid #e5e7eb;
      border-radius: 16px;
      background: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      color: #6b7280;
    }

    .type-btn .icon {
      font-size: 32px;
      font-weight: bold;
    }

    .type-btn:active {
      transform: scale(0.98);
    }

    .type-btn.active {
      border-width: 3px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }

    .type-btn.active.income {
      border-color: #10b981;
      background: linear-gradient(135deg, #d1fae5, #ffffff);
      color: #059669;
    }

    .type-btn.active.expense {
      border-color: #ef4444;
      background: linear-gradient(135deg, #fee2e2, #ffffff);
      color: #dc2626;
    }

    .type-btn.active.transfer {
      border-color: #3b82f6;
      background: linear-gradient(135deg, #dbeafe, #ffffff);
      color: #2563eb;
    }

    .quick-form {
      background: white;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    .amount-input-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding: 16px 20px;
      background: #f9fafb;
      border-radius: 16px;
      border: 2px solid #e5e7eb;
    }

    .currency {
      font-size: 32px;
      font-weight: 700;
      color: #6b7280;
    }

    .amount-input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 40px;
      font-weight: 700;
      color: #1f2937;
      outline: none;
      width: 100%;
    }

    .amount-input::placeholder {
      color: #d1d5db;
    }

    .amount-input::-webkit-inner-spin-button,
    .amount-input::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .description-input {
      width: 100%;
      padding: 16px 20px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 16px;
      transition: all 0.2s;
    }

    .description-input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .envelope-select {
      width: 100%;
      padding: 16px 20px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 16px;
      transition: all 0.2s;
      background: white;
      cursor: pointer;
    }

    .envelope-select:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .envelope-select.hide {
      display: none;
    }

    .payment-select {
      width: 100%;
      padding: 16px 20px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 16px;
      transition: all 0.2s;
      background: white;
      cursor: pointer;
    }

    .payment-select:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .transfer-from {
      display: none;
    }

    .transfer-from.show {
      display: block;
    }

    .transfer-to {
      display: none;
    }

    .transfer-to.show {
      display: block;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      transition: all 0.2s;
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    .submit-btn.income {
      background: linear-gradient(135deg, #10b981, #059669);
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.3);
    }

    .submit-btn.expense {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 4px 16px rgba(239, 68, 68, 0.3);
    }

    .submit-btn.transfer {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      box-shadow: 0 4px 16px rgba(59, 130, 246, 0.3);
    }

    .recent-transactions {
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    .recent-transactions h3 {
      font-size: 18px;
      font-weight: 700;
      color: #1f2937;
      margin: 0 0 16px 0;
    }

    .transaction-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 8px;
      transition: all 0.2s;
    }

    .transaction-item:hover {
      background: #f9fafb;
    }

    .transaction-item:last-child {
      margin-bottom: 0;
    }

    .transaction-icon {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      border-radius: 12px;
      background: #f3f4f6;
    }

    .transaction-item.income .transaction-icon {
      background: #d1fae5;
    }

    .transaction-item.expense .transaction-icon {
      background: #fee2e2;
    }

    .transaction-details {
      flex: 1;
    }

    .transaction-desc {
      font-size: 16px;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 4px;
    }

    .transaction-time {
      font-size: 13px;
      color: #9ca3af;
    }

    .transaction-amount {
      font-size: 18px;
      font-weight: 700;
    }

    .transaction-item.income .transaction-amount {
      color: #059669;
    }

    .transaction-item.expense .transaction-amount {
      color: #dc2626;
    }

    .save-budget-btn:active {
      transform: translateY(0);
    }

    .envelope-budget {
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    .envelope-budget h3 {
      font-size: 18px;
      font-weight: 700;
      color: #1f2937;
      margin: 0 0 16px 0;
    }

    .envelope-item {
      margin-bottom: 16px;
    }

    .envelope-item:last-child {
      margin-bottom: 0;
    }

    .envelope-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .envelope-name {
      font-size: 15px;
      font-weight: 600;
      color: #1f2937;
    }

    .envelope-amounts {
      font-size: 14px;
      font-weight: 700;
      color: #6b7280;
    }

    .envelope-bar {
      height: 8px;
      background: #f3f4f6;
      border-radius: 8px;
      overflow: hidden;
    }

    .envelope-progress {
      height: 100%;
      border-radius: 8px;
      transition: width 0.3s ease;
    }

    .budget-envelope-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .budget-envelope-name {
      flex: 0 0 100px;
      font-size: 14px;
      font-weight: 600;
      color: #1f2937;
      word-break: break-word;
    }

    .budget-input {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 15px;
      transition: all 0.2s;
    }

    .budget-input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .save-budget-btn {
      flex: 0 0 auto;
      padding: 10px 16px;
      border: none;
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
      white-space: nowrap;
    }

    .save-budget-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
    }

    .save-budget-btn:active {
      transform: translateY(0);
    }

    @media (min-width: 768px) {
      .quick-track {
        max-width: 600px;
        padding: 24px;
      }

      .payment-value {
        font-size: 20px;
      }

      .balance-value {
        font-size: 22px;
      }

      .type-btn {
        padding: 28px;
      }

      .quick-form {
        padding: 32px;
      }
    }

    @media (max-width: 480px) {
      .payment-balances {
        grid-template-columns: repeat(2, 1fr);
      }

      .type-btn {
        padding: 16px;
        font-size: 14px;
      }

      .type-btn .icon {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="quick-track">
    <div class="top-bar">
      <button class="profile-btn" id="profileBtn">⚙️</button>
      <div class="year-selector">
        <button class="year-nav" id="prevYear">‹</button>
        <select id="yearSelect" class="year-select">
          <option value="2023">2023</option>
          <option value="2024">2024</option>
          <option value="2025" selected>2025</option>
          <option value="2026">2026</option>
          <option value="2027">2027</option>
        </select>
        <button class="year-nav" id="nextYear">›</button>
      </div>
      <div class="month-selector">
        <button class="month-nav" id="prevMonth">‹</button>
        <select id="monthSelect" class="month-select">
          <option value="ALL">All Months</option>
          <option value="2025-01">Jan 2025</option>
          <option value="2025-02" selected>Feb 2025</option>
          <option value="2025-03">Mar 2025</option>
        </select>
        <button class="month-nav" id="nextMonth">›</button>
      </div>
    </div>

    <div class="balance-summary-wrapper">
      <div class="balance-header" id="balanceHeader">
        <div class="balance-title">Income & Expense</div>
        <div class="toggle-icon" id="balanceToggleIcon">▼</div>
      </div>
      <div class="balance-summary" id="balanceSummary">
        <div class="balance-item income">
          <div class="balance-label">Income</div>
          <div class="balance-value" id="totalIncome">₹0</div>
        </div>
        <div class="balance-item expense">
          <div class="balance-label">Expense</div>

      <input
        type="text"

        placeholder="What's this for?"

      </select>

      <select id="transferTo" class="payment-select transfer-to">
        <option value="">To Payment Method</option>
      </select>

        <option value="">Select Payment Method</option>
      </select>

        Add Expense

    <div class="envelope-budget">
      <h3>Envelope Budget vs Actual</h3>
      <div id="envelopeBudgetList">
        <!-- Dynamic envelope budget items will be inserted here -->
      </div>

  <div class="modal" id="profileModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">Settings</div>
        <button class="close-btn" id="closeModal">×</button>
      </div>

      <div class="modal-tabs">
        <button class="tab-btn active" id="paymentTab">Payment Methods</button>
        <button class="tab-btn" id="envelopeTab">Envelopes</button>
        <button class="tab-btn" id="budgetTab">Budget</button>
      </div>

        <div class="modal-section">
          <div class="section-title">Payment Methods</div>
          <div class="payment-method-list" id="paymentMethodList">
          </div>

            <input type="text" id="newPaymentMethod" class="add-payment-input" placeholder="Payment method name">
            <div class="add-payment-row">
              <input type="number" id="initialBalance" class="add-payment-input" placeholder="Initial balance" inputmode="decimal">
              <button class="add-btn" id="addPaymentBtn">Add</button>

          </div>

      <div class="tab-content" id="envelopeContent">
        <div class="modal-section">
          <div class="section-title">Envelopes</div>
          <div class="payment-method-list" id="envelopeList">
          </div>
          <div class="add-payment-form">
            <input type="text" id="newEnvelope" class="add-payment-input" placeholder="Envelope name">
            <div class="add-payment-row">
              <input type="number" id="defaultBudget" class="add-payment-input" placeholder="Default budget (optional)" inputmode="decimal">
              <button class="add-btn" id="addEnvelopeBtn">Add</button>
            </div>
          </div>
        </div>
      </div>

      <div class="tab-content" id="budgetContent">
        <div class="modal-section">
          <div class="section-title">Budget Allocation</div>
          <div class="add-payment-form" style="margin-bottom: 16px;">
            <select id="budgetMonth" class="add-payment-input">
              <option value="">Select Month</option>
            </select>
          </div>
          <div class="payment-method-list" id="budgetList">
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    // Toast notification function
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast ${type}`;
      setTimeout(() => toast.classList.add('show'), 10);
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    // Payment methods array
    let paymentMethods = JSON.parse(localStorage.getItem('paymentMethods')) || [];

    // Envelopes array
    let envelopes = JSON.parse(localStorage.getItem('envelopes')) || [];

    // Default budgets for envelopes - stores {envelope, defaultBudget}
    let defaultBudgets = JSON.parse(localStorage.getItem('defaultBudgets')) || {};

    // Budgets array - stores {envelope, month, amount}
    let budgets = JSON.parse(localStorage.getItem('budgets')) || [];

    // Transactions array - stores all transactions
    let transactions = JSON.parse(localStorage.getItem('transactions')) || [];

    // Save to localStorage
    function saveToLocalStorage() {
      localStorage.setItem('paymentMethods', JSON.stringify(paymentMethods));
      localStorage.setItem('envelopes', JSON.stringify(envelopes));
      localStorage.setItem('defaultBudgets', JSON.stringify(defaultBudgets));
      localStorage.setItem('budgets', JSON.stringify(budgets));
      localStorage.setItem('transactions', JSON.stringify(transactions));
    }

    function deletePaymentMethod(name) {
      if (confirm(`Delete ${name}?`)) {
        paymentMethods = paymentMethods.filter(method => method !== name);
        updatePaymentMethodsList();
        updatePaymentDropdowns();
        saveToLocalStorage();
        showToast(`${name} deleted`, 'error');
      }
    }

    function deleteEnvelope(name) {
      if (confirm(`Delete ${name}?`)) {
        envelopes = envelopes.filter(env => env !== name);
        delete defaultBudgets[name];
        updateEnvelopesList();
        updateEnvelopeDropdowns();
        saveToLocalStorage();
        showToast(`${name} deleted`, 'error');
      }
    }

    function deleteBudget(envelope, month) {
      if (confirm(`Delete budget for ${envelope} in ${month}?`)) {
        budgets = budgets.filter(b => !(b.envelope === envelope && b.month === month));
        updateBudgetList();
        saveToLocalStorage();
        showToast(`Budget deleted`, 'error');
      }
    }

    function saveBudget(envelope) {
      const selectedMonth = budgetMonth.value;
      const input = document.querySelector(`input[data-envelope="${envelope}"]`);
      const amount = input.value.trim();
      
      if (!amount) {
        showToast('Please enter a budget amount', 'error');
        return;
      }
      
      const existingBudget = budgets.find(b => b.envelope === envelope && b.month === selectedMonth);
      if (existingBudget) {
        existingBudget.amount = amount;
        showToast(`Budget updated: ${envelope}`, 'success');
      } else {
        budgets.push({ envelope, month: selectedMonth, amount });
        showToast(`Budget saved: ${envelope}`, 'success');
      }
      updateEnvelopeBudget();
      saveToLocalStorage();
    }

    function updatePaymentMethodsList() {
      const listContainer = document.getElementById('paymentMethodList');
      if (paymentMethods.length === 0) {
        listContainer.innerHTML = '<div style="padding: 16px; text-align: center; color: #6b7280;">No payment methods added yet.</div>';
        return;
      }
      listContainer.innerHTML = paymentMethods.map(method => `
        <div class="payment-method-item">
          <div class="payment-method-name">${method}</div>
          <button class="delete-btn" onclick="deletePaymentMethod('${method}')">Delete</button>
        </div>
      `).join('');
    }

    function updateEnvelopesList() {
      const listContainer = document.getElementById('envelopeList');
      if (envelopes.length === 0) {
        listContainer.innerHTML = '<div style="padding: 16px; text-align: center; color: #6b7280;">No envelopes added yet.</div>';
        return;
      }
      listContainer.innerHTML = envelopes.map(env => `
        <div class="payment-method-item">
          <div class="payment-method-name">${env}</div>
          <button class="delete-btn" onclick="deleteEnvelope('${env}')">Delete</button>
        </div>
      `).join('');
    }

    function updatePaymentDropdowns() {
      const paymentSelect = document.getElementById('paymentSelect');
      const transferFrom = document.getElementById('transferFrom');
      const transferTo = document.getElementById('transferTo');

      const options = paymentMethods.map(method => 
        `<option value="${method}">${method}</option>`
      ).join('');

      paymentSelect.innerHTML = '<option value="">Select Payment Method</option>' + options;
      transferFrom.innerHTML = '<option value="">From Payment Method</option>' + options;
      transferTo.innerHTML = '<option value="">To Payment Method</option>' + options;
    }

    function updateEnvelopeDropdowns() {
      const envelopeSelect = document.getElementById('envelopeSelect');

      const options = envelopes.map(env => 
        `<option value="${env}">${env}</option>`
      ).join('');

      envelopeSelect.innerHTML = '<option value="">Select Envelope</option>' + options;
    }

    function updateBalanceSummary() {
      const totalIncomeEl = document.getElementById('totalIncome');
      const totalExpenseEl = document.getElementById('totalExpense');
      
      const income = transactions
        .filter(t => t.type === 'income')
        .reduce((sum, t) => sum + parseFloat(t.amount), 0);
      
      const expense = transactions
        .filter(t => t.type === 'expense')
        .reduce((sum, t) => sum + parseFloat(t.amount), 0);
      
      totalIncomeEl.textContent = `₹${income.toLocaleString('en-IN')}`;
      totalExpenseEl.textContent = `₹${expense.toLocaleString('en-IN')}`;
    }

    function updatePaymentBalances() {
      const container = document.getElementById('paymentBalances');
      
      if (paymentMethods.length === 0) {
        container.innerHTML = '<div style="grid-column: 1/-1; padding: 16px; text-align: center; color: #6b7280;">No payment methods added yet.</div>';
        return;
      }
      
      container.innerHTML = paymentMethods.map((method, index) => {
        // Calculate balance for this payment method
        let balance = 0;
        
        transactions.forEach(t => {
          if (t.type === 'income' && t.payment === method) {
            balance += parseFloat(t.amount);
          } else if (t.type === 'expense' && t.payment === method) {
            balance -= parseFloat(t.amount);
          } else if (t.type === 'transfer') {
            if (t.from === method) balance -= parseFloat(t.amount);
            if (t.to === method) balance += parseFloat(t.amount);
          }
        });
        
        const colors = ['hdfc', 'sbi', 'cash', 'transfer'];
        const colorClass = colors[index % colors.length];
        
        return `
          <div class="payment-item ${colorClass}">
            <div class="payment-label">${method}</div>
            <div class="payment-value">₹${balance.toLocaleString('en-IN')}</div>
          </div>
        `;
      }).join('');
    }

    function getTimeAgo(dateString) {
      const now = new Date();
      const date = new Date(dateString);
      const seconds = Math.floor((now - date) / 1000);
      
      if (seconds < 60) return 'Just now';
      if (seconds < 3600) return `${Math.floor(seconds / 60)} mins ago`;
      if (seconds < 86400) return `${Math.floor(seconds / 3600)} hours ago`;
      if (seconds < 172800) return 'Yesterday';
      return date.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
    }

    function getTransactionIcon(type, description) {
      if (type === 'income') return '💰';
      if (type === 'transfer') return '🔄';
      
      // Expense icons based on description
      const desc = description.toLowerCase();
      if (desc.includes('food') || desc.includes('lunch') || desc.includes('dinner') || desc.includes('breakfast')) return '🍔';
      if (desc.includes('transport') || desc.includes('uber') || desc.includes('taxi') || desc.includes('bus')) return '🚕';
      if (desc.includes('shopping') || desc.includes('clothes')) return '🛍️';
      if (desc.includes('entertainment') || desc.includes('movie')) return '🎬';
      if (desc.includes('grocery') || desc.includes('groceries')) return '🛒';
      return '💸';
    }

    function updateRecentTransactions() {
      const listContainer = document.getElementById('recentTransactionsList');
      
      if (transactions.length === 0) {
        listContainer.innerHTML = '<div style="padding: 16px; text-align: center; color: #6b7280;">No transactions yet.</div>';
        return;
      }
      
      // Get last 10 transactions, sorted by date (newest first)
      const recentTransactions = [...transactions]
        .sort((a, b) => new Date(b.date) - new Date(a.date))
        .slice(0, 10);
      
      listContainer.innerHTML = recentTransactions.map(t => {
        const icon = getTransactionIcon(t.type, t.description || '');
        const timeAgo = getTimeAgo(t.date);
        const sign = t.type === 'income' ? '+' : (t.type === 'transfer' ? '' : '-');
        const amount = t.type === 'transfer' 
          ? `${t.from} → ${t.to}` 
          : `${sign}₹${parseFloat(t.amount).toLocaleString('en-IN')}`;
        
        return `
          <div class="transaction-item ${t.type}">
            <div class="transaction-icon">${icon}</div>
            <div class="transaction-details">
              <div class="transaction-desc">${t.description || 'Transfer'}</div>
              <div class="transaction-time">${timeAgo}</div>
            </div>
            <div class="transaction-amount">${amount}</div>
          </div>
        `;
      }).join('');
    }

    function updateEnvelopeBudget() {
      const container = document.getElementById('envelopeBudgetList');
      const selectedMonth = monthSelect.value;
      
      if (envelopes.length === 0) {
        container.innerHTML = '<div style="padding: 16px; text-align: center; color: #6b7280;">No envelopes available.</div>';
        return;
      }
      
      container.innerHTML = envelopes.map(envelope => {
        // Get budget for this envelope and month
        const budget = budgets.find(b => b.envelope === envelope && b.month === selectedMonth);
        const budgetAmount = budget ? parseFloat(budget.amount) : 0;
        
        // Calculate actual spending for this envelope and month
        let actualSpent = 0;
        
        if (selectedMonth === 'ALL') {
          // Calculate for all months
          actualSpent = transactions
            .filter(t => t.type === 'expense' && t.envelope === envelope)
            .reduce((sum, t) => sum + parseFloat(t.amount || 0), 0);
        } else {
          // Calculate for specific month
          actualSpent = transactions
            .filter(t => {
              if (t.type !== 'expense' || t.envelope !== envelope) return false;
              if (!t.date) return false;
              
              // Extract year-month from transaction date
              const transactionMonth = t.date.substring(0, 7); // Gets "2025-02" from "2025-02-15T..."
              return transactionMonth === selectedMonth;
            })
            .reduce((sum, t) => sum + parseFloat(t.amount || 0), 0);
        }
        
        // Calculate percentage and color
        const percentage = budgetAmount > 0 ? (actualSpent / budgetAmount) * 100 : 0;
        let color = '#22c55e'; // Green
        if (percentage >= 100) color = '#ef4444'; // Red
        else if (percentage >= 90) color = '#f59e0b'; // Orange
        
        return `
          <div class="envelope-item">
            <div class="envelope-header">
              <span class="envelope-name">${envelope}</span>
              <span class="envelope-amounts">₹${actualSpent.toLocaleString('en-IN')} / ₹${budgetAmount.toLocaleString('en-IN')}</span>
            </div>
            <div class="envelope-bar">
              <div class="envelope-progress" style="width: ${Math.min(percentage, 100)}%; background-color: ${color};"></div>
            </div>
          </div>
        `;
      }).join('');
    }

    function generateMonthOptions() {
      const budgetMonth = document.getElementById('budgetMonth');
      const months = [];
      const currentYear = new Date().getFullYear();
      
      for (let year = currentYear - 1; year <= currentYear + 2; year++) {
        for (let month = 1; month <= 12; month++) {
          const monthStr = `${year}-${String(month).padStart(2, '0')}`;
          const date = new Date(year, month - 1);
          const monthName = date.toLocaleString('default', { month: 'short' });
          months.push(`<option value="${monthStr}">${monthName} ${year}</option>`);
        }
      }

      budgetMonth.innerHTML = '<option value="">Select Month</option>' + months.join('');
    }

    function updateBudgetList() {
      const selectedMonth = budgetMonth.value;
      const listContainer = document.getElementById('budgetList');
      
      if (!selectedMonth) {
        listContainer.innerHTML = '';
        return;
      }
      
      if (envelopes.length === 0) {
        listContainer.innerHTML = '<div style="padding: 16px; text-align: center; color: #6b7280;">No envelopes available. Add envelopes first.</div>';
        return;
      }
      
      listContainer.innerHTML = envelopes.map(envelope => {
        const existingBudget = budgets.find(b => b.envelope === envelope && b.month === selectedMonth);
        const budgetValue = existingBudget ? existingBudget.amount : (defaultBudgets[envelope] || '');
        return `
          <div class="budget-envelope-item">
            <div class="budget-envelope-name">${envelope}</div>
            <input 
              type="number" 
              class="budget-input" 
              placeholder="Budget amount" 
              value="${budgetValue}"
              data-envelope="${envelope}"
              inputmode="decimal"
            />
            <button class="save-budget-btn" onclick="saveBudget('${envelope}')">Save</button>
          </div>
        `;
      }).join('');
    }
    const incomeBtn = document.getElementById('incomeBtn');
    const expenseBtn = document.getElementById('expenseBtn');
    const transferBtn = document.getElementById('transferBtn');
    const submitBtn = document.getElementById('submitBtn');
    const amountInput = document.getElementById('amountInput');
    const descriptionInput = document.getElementById('descriptionInput');
    const envelopeSelect = document.getElementById('envelopeSelect');
    const paymentSelect = document.getElementById('paymentSelect');
    const transferFrom = document.getElementById('transferFrom');
    const transferTo = document.getElementById('transferTo');
    const quickForm = document.getElementById('quickForm');
    const monthSelect = document.getElementById('monthSelect');
    const prevMonth = document.getElementById('prevMonth');
    const nextMonth = document.getElementById('nextMonth');
    const yearSelect = document.getElementById('yearSelect');
    const prevYear = document.getElementById('prevYear');
    const nextYear = document.getElementById('nextYear');
    const paymentHeader = document.getElementById('paymentHeader');
    const paymentBalances = document.getElementById('paymentBalances');
    const toggleIcon = document.getElementById('toggleIcon');
    const balanceHeader = document.getElementById('balanceHeader');
    const balanceSummary = document.getElementById('balanceSummary');
    const balanceToggleIcon = document.getElementById('balanceToggleIcon');
    const profileBtn = document.getElementById('profileBtn');
    const profileModal = document.getElementById('profileModal');
    const closeModal = document.getElementById('closeModal');
    const addPaymentBtn = document.getElementById('addPaymentBtn');
    const newPaymentMethod = document.getElementById('newPaymentMethod');
    const initialBalance = document.getElementById('initialBalance');
    const paymentMethodList = document.getElementById('paymentMethodList');
    const addEnvelopeBtn = document.getElementById('addEnvelopeBtn');
    const newEnvelope = document.getElementById('newEnvelope');
    const defaultBudget = document.getElementById('defaultBudget');
    const envelopeList = document.getElementById('envelopeList');
    const budgetMonth = document.getElementById('budgetMonth');
    const budgetList = document.getElementById('budgetList');
    const paymentTab = document.getElementById('paymentTab');
    const envelopeTab = document.getElementById('envelopeTab');
    const budgetTab = document.getElementById('budgetTab');
    const paymentContent = document.getElementById('paymentContent');
    const envelopeContent = document.getElementById('envelopeContent');
    const budgetContent = document.getElementById('budgetContent');

    let activeType = 'expense';

    // Initialize payment methods list and dropdowns
    updatePaymentMethodsList();
    updatePaymentDropdowns();
    updateEnvelopesList();
    updateEnvelopeDropdowns();
    generateMonthOptions();
    updateBalanceSummary();
    updateRecentTransactions();
    updatePaymentBalances();
    updateEnvelopeBudget();

    // Profile button
    profileBtn.addEventListener('click', () => {
      profileModal.classList.add('show');
    });

    // Tab switching
    paymentTab.addEventListener('click', () => {
      paymentTab.classList.add('active');
      envelopeTab.classList.remove('active');
      budgetTab.classList.remove('active');
      paymentContent.classList.add('active');
      envelopeContent.classList.remove('active');
      budgetContent.classList.remove('active');
    });

    envelopeTab.addEventListener('click', () => {
      envelopeTab.classList.add('active');
      paymentTab.classList.remove('active');
      budgetTab.classList.remove('active');
      envelopeContent.classList.add('active');
      paymentContent.classList.remove('active');
      budgetContent.classList.remove('active');
    });

    budgetTab.addEventListener('click', () => {
      budgetTab.classList.add('active');
      paymentTab.classList.remove('active');
      envelopeTab.classList.remove('active');
      budgetContent.classList.add('active');
      paymentContent.classList.remove('active');
      envelopeContent.classList.remove('active');
    });

    // Close modal
    closeModal.addEventListener('click', () => {
      profileModal.classList.remove('show');
    });

    // Close modal on outside click
    profileModal.addEventListener('click', (e) => {
      if (e.target === profileModal) {
        profileModal.classList.remove('show');
      }
    });

    // Add payment method
    addPaymentBtn.addEventListener('click', () => {
      const methodName = newPaymentMethod.value.trim();
      const balance = initialBalance.value.trim();
      if (methodName) {
        if (!paymentMethods.includes(methodName)) {
          paymentMethods.push(methodName);
          updatePaymentMethodsList();
          updatePaymentDropdowns();
          updatePaymentBalances();
          saveToLocalStorage();
          const balanceMsg = balance ? ` with initial balance ₹${balance}` : '';
          showToast(`${methodName}${balanceMsg} added!`, 'success');
          newPaymentMethod.value = '';
          initialBalance.value = '';
        } else {
          showToast('Payment method already exists!', 'error');
        }
      }
    });

    // Add envelope
    addEnvelopeBtn.addEventListener('click', () => {
      const envelopeName = newEnvelope.value.trim();
      const budget = defaultBudget.value.trim();
      if (envelopeName) {
        if (!envelopes.includes(envelopeName)) {
          envelopes.push(envelopeName);
          if (budget) {
            defaultBudgets[envelopeName] = budget;
          }
          updateEnvelopesList();
          updateEnvelopeDropdowns();
          saveToLocalStorage();
          const budgetMsg = budget ? ` with default budget ₹${budget}` : '';
          showToast(`${envelopeName}${budgetMsg} added!`, 'success');
          newEnvelope.value = '';
          defaultBudget.value = '';
        } else {
          showToast('Envelope already exists!', 'error');
        }
      }
    });

    // Month selection change
    budgetMonth.addEventListener('change', () => {
      updateBudgetList();
    });

    // Payment balances toggle
    paymentHeader.addEventListener('click', () => {
      paymentBalances.classList.toggle('collapsed');
      toggleIcon.classList.toggle('collapsed');
    });

    // Balance summary toggle
    balanceHeader.addEventListener('click', () => {
      balanceSummary.classList.toggle('collapsed');
      balanceToggleIcon.classList.toggle('collapsed');
    });

    // Year navigation
    prevYear.addEventListener('click', () => {
      const currentIndex = yearSelect.selectedIndex;
      if (currentIndex > 0) {
        yearSelect.selectedIndex = currentIndex - 1;
      }
    });

    nextYear.addEventListener('click', () => {
      const currentIndex = yearSelect.selectedIndex;
      if (currentIndex < yearSelect.options.length - 1) {
        yearSelect.selectedIndex = currentIndex + 1;
      }
    });

    // Month navigation
    prevMonth.addEventListener('click', () => {
      const currentIndex = monthSelect.selectedIndex;
      if (currentIndex > 0) {
        monthSelect.selectedIndex = currentIndex - 1;
        updateEnvelopeBudget();
      }
    });

    nextMonth.addEventListener('click', () => {
      const currentIndex = monthSelect.selectedIndex;
      if (currentIndex < monthSelect.options.length - 1) {
        monthSelect.selectedIndex = currentIndex + 1;
        updateEnvelopeBudget();
      }
    });

    // Month select change
    monthSelect.addEventListener('change', () => {
      updateEnvelopeBudget();
    });

    incomeBtn.addEventListener('click', () => {
      activeType = 'income';
      incomeBtn.classList.add('active', 'income');
      expenseBtn.classList.remove('active', 'expense');
      transferBtn.classList.remove('active', 'transfer');
      submitBtn.classList.remove('expense', 'transfer');
      submitBtn.classList.add('income');
      submitBtn.textContent = 'Add Income';
      descriptionInput.placeholder = "What's this for?";
      envelopeSelect.classList.add('hide');
      paymentSelect.style.display = 'block';
      transferFrom.classList.remove('show');
      transferTo.classList.remove('show');
    });

    expenseBtn.addEventListener('click', () => {
      activeType = 'expense';
      expenseBtn.classList.add('active', 'expense');
      incomeBtn.classList.remove('active', 'income');
      transferBtn.classList.remove('active', 'transfer');
      submitBtn.classList.remove('income', 'transfer');
      submitBtn.classList.add('expense');
      submitBtn.textContent = 'Add Expense';
      descriptionInput.placeholder = "What's this for?";
      envelopeSelect.classList.remove('hide');
      paymentSelect.style.display = 'block';
      transferFrom.classList.remove('show');
      transferTo.classList.remove('show');
    });

    transferBtn.addEventListener('click', () => {
      activeType = 'transfer';
      transferBtn.classList.add('active', 'transfer');
      incomeBtn.classList.remove('active', 'income');
      expenseBtn.classList.remove('active', 'expense');
      submitBtn.classList.remove('income', 'expense');
      submitBtn.classList.add('transfer');
      submitBtn.textContent = 'Add Transfer';
      descriptionInput.placeholder = 'Transfer description (optional)';
      envelopeSelect.classList.add('hide');
      paymentSelect.style.display = 'none';
      transferFrom.classList.add('show');
      transferTo.classList.add('show');
    });

    quickForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const amount = amountInput.value;
      const description = descriptionInput.value;
      const envelope = envelopeSelect.value;
      const payment = paymentSelect.value;
      const fromPayment = transferFrom.value;
      const toPayment = transferTo.value;
      
      if (activeType === 'transfer') {
        if (amount && fromPayment && toPayment) {
          const transaction = {
            id: Date.now(),
            type: 'transfer',
            amount,
            description,
            from: fromPayment,
            to: toPayment,
            date: new Date().toISOString()
          };
          transactions.push(transaction);
          saveToLocalStorage();
          updateBalanceSummary();
          updateRecentTransactions();
          updatePaymentBalances();
          updateEnvelopeBudget();
          const message = `Transfer: ₹${amount} from ${fromPayment} to ${toPayment}`;
          showToast(message, 'success');
          amountInput.value = '';
          descriptionInput.value = '';
          transferFrom.selectedIndex = 0;
          transferTo.selectedIndex = 0;
          amountInput.focus();
        } else {
          showToast('Please fill all required fields', 'error');
        }
      } else if (activeType === 'income') {
        if (amount && description && payment) {
          const transaction = {
            id: Date.now(),
            type: 'income',
            amount,
            description,
            payment,
            date: new Date().toISOString()
          };
          transactions.push(transaction);
          saveToLocalStorage();
          updateBalanceSummary();
          updateRecentTransactions();
          updatePaymentBalances();
          updateEnvelopeBudget();
          const message = `Income: ₹${amount} - ${description}`;
          showToast(message, 'success');
          amountInput.value = '';
          descriptionInput.value = '';
          paymentSelect.selectedIndex = 0;
          amountInput.focus();
        } else {
          if (!amount) showToast('Please enter amount', 'error');
          else if (!description) showToast('Please enter description', 'error');
          else if (!payment) showToast('Please select payment method', 'error');
        }
      } else {
        if (amount && description && envelope && payment) {
          const transaction = {
            id: Date.now(),
            type: 'expense',
            amount,
            description,
            envelope,
            payment,
            date: new Date().toISOString()
          };
          transactions.push(transaction);
          saveToLocalStorage();
          updateBalanceSummary();
          updateRecentTransactions();
          updatePaymentBalances();
          updateEnvelopeBudget();
          const message = `Expense: ₹${amount} - ${description}`;
          showToast(message, 'success');
          amountInput.value = '';
          descriptionInput.value = '';
          envelopeSelect.selectedIndex = 0;
          paymentSelect.selectedIndex = 0;
          amountInput.focus();
        } else {
          if (!amount) showToast('Please enter amount', 'error');
          else if (!description) showToast('Please enter description', 'error');
          else if (!envelope) showToast('Please select envelope', 'error');
          else if (!payment) showToast('Please select payment method', 'error');
        }
      }
    });
  </script>
</body>
</html>
