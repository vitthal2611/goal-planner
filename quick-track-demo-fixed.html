<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Track UI - Mock Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f8f9fa;
    }

    .quick-track {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
      background: #f8f9fa;
      min-height: 100vh;
    }

    .app-header {
      font-size: 28px;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 20px;
      text-align: left;
      letter-spacing: -0.5px;
    }

    .identity-group {
      margin-bottom: 20px;
    }

    .identity-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: linear-gradient(135deg, #eef2ff, #e0e7ff);
      border-left: 4px solid #4f46e5;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: 700;
      color: #1e40af;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .identity-habits {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-left: 8px;
    }

    .habit-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: #ffffff;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      transition: all 0.2s;
    }

    .habit-item.completed {
      background: #f0fdf4;
      border-color: #86efac;
    }

    .check-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid #e5e7eb;
      background: white;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .check-btn.checked {
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      border-color: #22c55e;
      color: white;
    }

    .habit-info {
      flex: 1;
    }

    .identity-badge {
      font-size: 11px;
      color: #6366f1;
      background: linear-gradient(135deg, #eef2ff, #e0e7ff);
      padding: 6px 12px;
      border-radius: 10px;
      display: inline-block;
      margin-bottom: 8px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: 1px solid #c7d2fe;
    }

    .habit-title {
      font-size: 15px;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 4px;
    }

    .habit-cue {
      font-size: 13px;
      color: #6b7280;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .habit-streak {
      text-align: center;
      padding: 0 12px;
    }

    .streak-number {
      font-size: 20px;
      font-weight: 800;
      color: #f59e0b;
    }

    .streak-label {
      font-size: 11px;
      color: #6b7280;
      text-transform: uppercase;
      font-weight: 600;
    }

    .group-btn {
      padding: 6px 12px;
      border: 2px solid #e5e7eb;
      background: transparent;
      color: #6b7280;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .group-btn.active {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: white;
      border-color: #4f46e5;
    }

    @media (max-width: 480px) {
      .quick-track {
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="quick-track">
    <div class="app-header">Life Tracker</div>
    
    <div style="background: white; border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3 style="font-size: 18px; font-weight: 700; color: #1f2937; margin: 0;">Today's Habits</h3>
        <div style="display: flex; gap: 8px; align-items: center;">
          <div style="font-size: 13px; font-weight: 600; color: #6b7280; background: #f3f4f6; padding: 8px 14px; border-radius: 10px; display: flex; align-items: center; gap: 6px;" id="habitStats"><span style="font-size: 16px;">✓</span> 0/0</div>
          <button id="groupByIdentityBtn" class="group-btn" onclick="toggleGroupByIdentity()">Group</button>
        </div>
      </div>
      <div id="listView" style="display: flex; flex-direction: column; gap: 10px;">
        <div style="padding: 32px 16px; text-align: center; color: #9ca3af; font-size: 15px;">✨ No habits yet. Create one to get started!</div>
      </div>
    </div>
  </div>

  <script>
    let habits = [
      {
        id: '1',
        identity: 'I am a morning person',
        triggerCue: 'wake up',
        triggerTime: '06:00',
        routineAction: 'Go for a walk',
        routineLocation: 'Park',
        immediateReward: 'Feel energized'
      },
      {
        id: '2',
        identity: 'I am a morning person',
        triggerCue: 'finish breakfast',
        triggerTime: '07:00',
        routineAction: 'Meditate',
        routineLocation: 'Home',
        immediateReward: 'Feel calm'
      },
      {
        id: '3',
        identity: 'I am a fitness enthusiast',
        triggerCue: 'finish work',
        triggerTime: '18:00',
        routineAction: 'Hit the gym',
        routineLocation: 'Gym',
        immediateReward: 'Feel strong'
      },
      {
        id: '4',
        identity: 'I am a reader',
        triggerCue: 'have dinner',
        triggerTime: '20:00',
        routineAction: 'Read a book',
        routineLocation: 'Bedroom',
        immediateReward: 'Learn something new'
      }
    ];

    let habitCheckins = {};
    let groupByIdentity = false;
    let selectedDate = new Date().toISOString().split('T')[0];

    function toggleGroupByIdentity() {
      groupByIdentity = !groupByIdentity;
      const btn = document.getElementById('groupByIdentityBtn');
      if (groupByIdentity) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
      updateListView();
    }

    function isCheckedOnDate(habitId, date) {
      return habitCheckins[date] && habitCheckins[date].includes(habitId);
    }

    function toggleHabitCheckIn(habitId, date) {
      if (!habitCheckins[date]) {
        habitCheckins[date] = [];
      }
      const index = habitCheckins[date].indexOf(habitId);
      if (index > -1) {
        habitCheckins[date].splice(index, 1);
      } else {
        habitCheckins[date].push(habitId);
      }
      updateListView();
    }

    function getStreak(habitId) {
      let streak = 0;
      let checkDate = new Date(selectedDate);
      while (true) {
        const dateStr = checkDate.toISOString().split('T')[0];
        if (!isCheckedOnDate(habitId, dateStr)) break;
        streak++;
        checkDate.setDate(checkDate.getDate() - 1);
      }
      return streak;
    }

    function updateListView() {
      const listContainer = document.getElementById('listView');
      const completedCount = habits.filter(h => isCheckedOnDate(h.id, selectedDate)).length;
      document.getElementById('habitStats').textContent = `✓ ${completedCount}/${habits.length}`;

      const sortedHabits = [...habits].sort((a, b) => {
        const timeA = a.triggerTime || '23:59';
        const timeB = b.triggerTime || '23:59';
        return timeA.localeCompare(timeB);
      });

      let html = '';

      if (groupByIdentity) {
        // Group by Identity
        const habitsByIdentity = {};
        sortedHabits.forEach(habit => {
          const identity = habit.identity || 'No Identity';
          if (!habitsByIdentity[identity]) {
            habitsByIdentity[identity] = [];
          }
          habitsByIdentity[identity].push(habit);
        });

        html = Object.entries(habitsByIdentity).map(([identity, groupHabits]) => {
          const identityName = identity.replace('I am ', '');
          const habitsHTML = groupHabits.map(habit => {
            const checked = isCheckedOnDate(habit.id, selectedDate);
            const streak = getStreak(habit.id);
            const timeDisplay = habit.triggerTime ? ` at ${habit.triggerTime}` : '';
            
            return `
              <div class="habit-item ${checked ? 'completed' : ''}">
                <button class="check-btn ${checked ? 'checked' : ''}" onclick="toggleHabitCheckIn('${habit.id}', '${selectedDate}')">${checked ? '✓' : ''}</button>
                <div class="habit-info">
                  <div class="habit-title">${habit.routineAction}</div>
                  <div class="habit-cue">
                    <span>🔔 After I ${habit.triggerCue}${timeDisplay}</span>
                    ${habit.routineLocation ? `<span>📍 ${habit.routineLocation}</span>` : ''}
                  </div>
                </div>
                <div class="habit-streak">
                  <div class="streak-number">${streak}</div>
                  <div class="streak-label">🔥 Streak</div>
                </div>
              </div>
            `;
          }).join('');

          return `
            <div class="identity-group">
              <div class="identity-header">✨ ${identityName}</div>
              <div class="identity-habits">${habitsHTML}</div>
            </div>
          `;
        }).join('');
      } else {
        // Sort by Time only - show identity on each card
        html = sortedHabits.map(habit => {
          const checked = isCheckedOnDate(habit.id, selectedDate);
          const streak = getStreak(habit.id);
          const timeDisplay = habit.triggerTime ? ` at ${habit.triggerTime}` : '';
          const identityName = habit.identity ? habit.identity.replace('I am ', '') : '';
          
          return `
            <div class="habit-item ${checked ? 'completed' : ''}">
              <button class="check-btn ${checked ? 'checked' : ''}" onclick="toggleHabitCheckIn('${habit.id}', '${selectedDate}')">${checked ? '✓' : ''}</button>
              <div class="habit-info">
                ${identityName ? `<div class="identity-badge">✨ ${identityName}</div>` : ''}
                <div class="habit-title">${habit.routineAction}</div>
                <div class="habit-cue">
                  <span>🔔 After I ${habit.triggerCue}${timeDisplay}</span>
                  ${habit.routineLocation ? `<span>📍 ${habit.routineLocation}</span>` : ''}
                </div>
              </div>
              <div class="habit-streak">
                <div class="streak-number">${streak}</div>
                <div class="streak-label">🔥 Streak</div>
              </div>
            </div>
          `;
        }).join('');
      }

      listContainer.innerHTML = html || '<div style="padding: 32px 16px; text-align: center; color: #64748b; font-size: 16px;">✨ No habits scheduled for today.</div>';
    }

    updateListView();
  </script>
</body>
</html>
