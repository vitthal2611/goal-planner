<!-- Simplified Atomic Habit Form aligned with James Clear's framework -->
<div style="background: white; border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);">
  <h3 style="font-size: 18px; font-weight: 700; color: #1f2937; margin: 0 0 16px 0;">Build Your Atomic Habit</h3>
  <form id="atomicHabitForm" style="display: flex; flex-direction: column; gap: 16px;">
    <!-- Identity Section -->
    <div class="habit-section">
      <div class="section-header" onclick="toggleSection(this)" style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; padding: 12px; background: #f3f4f6; border-radius: 12px; margin-bottom: 12px;">
        <span style="font-weight: 700; color: #1f2937;">Identity</span>
        <span class="section-toggle" style="font-size: 20px; transition: transform 0.3s;">▼</span>
      </div>
      <div class="section-content" style="display: flex; flex-direction: column; gap: 12px;">
        <div style="font-size: 12px; color: #6b7280; margin-bottom: 8px; font-weight: 600;">Who do you want to become?</div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 16px; font-weight: 600; color: #374151;">I am</span>
          <input type="text" id="identity" placeholder="e.g., someone who exercises daily" style="flex: 1; padding: 12px 16px; border: 2px solid #e5e7eb; border-radius: 12px; font-size: 16px; outline: none; color: #1f2937;" />
        </div>
      </div>
    </div>

    <!-- Cue Section -->
    <div class="habit-section">
      <div class="section-header" onclick="toggleSection(this)" style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; padding: 12px; background: #f3f4f6; border-radius: 12px; margin-bottom: 12px;">
        <span style="font-weight: 700; color: #1f2937;">Cue</span>
        <span class="section-toggle" style="font-size: 20px; transition: transform 0.3s;">▼</span>
      </div>
      <div class="section-content" style="display: flex; flex-direction: column; gap: 12px;">
        <div style="font-size: 12px; color: #6b7280; margin-bottom: 8px; font-weight: 600;">When & where does the habit occur?</div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 16px; font-weight: 600; color: #374151;">After I</span>
          <input type="text" id="triggerCue" placeholder="wake up" style="flex: 1; padding: 12px 16px; border: 2px solid #e5e7eb; border-radius: 12px; font-size: 16px; outline: none; color: #1f2937;" />
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 16px; font-weight: 600; color: #374151;">at</span>
          <input type="time" id="triggerTime" placeholder="Time (optional)" style="flex: 1; padding: 12px 16px; border: 2px solid #e5e7eb; border-radius: 12px; font-size: 16px;" />
        </div>
      </div>
    </div>

    <!-- Routine (Response) Section -->
    <div class="habit-section">
      <div class="section-header" onclick="toggleSection(this)" style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; padding: 12px; background: #f3f4f6; border-radius: 12px; margin-bottom: 12px;">
        <span style="font-weight: 700; color: #1f2937;">Routine (Response)</span>
        <span class="section-toggle" style="font-size: 20px; transition: transform 0.3s;">▼</span>
      </div>
      <div class="section-content" style="display: flex; flex-direction: column; gap: 12px;">
        <div style="font-size: 12px; color: #6b7280; margin-bottom: 8px; font-weight: 600;">What is the new behavior?</div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 16px; font-weight: 600; color: #374151;">I will</span>
          <input type="text" id="routineAction" placeholder="go for a morning walk" style="flex: 1; padding: 12px 16px; border: 2px solid #e5e7eb; border-radius: 12px; font-size: 16px;" />
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 16px; font-weight: 600; color: #374151;">at</span>
          <input type="text" id="routineLocation" placeholder="location (e.g., park)" style="flex: 1; padding: 12px 16px; border: 2px solid #e5e7eb; border-radius: 12px; font-size: 16px;" />
        </div>
      </div>
    </div>

    <!-- Reward Section -->
    <div class="habit-section">
      <div class="section-header" onclick="toggleSection(this)" style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; padding: 12px; background: #f3f4f6; border-radius: 12px; margin-bottom: 12px;">
        <span style="font-weight: 700; color: #1f2937;">Reward</span>
        <span class="section-toggle" style="font-size: 20px; transition: transform 0.3s;">▼</span>
      </div>
      <div class="section-content" style="display: flex; flex-direction: column; gap: 12px;">
        <div style="font-size: 12px; color: #6b7280; margin-bottom: 8px; font-weight: 600;">What's the immediate benefit?</div>
        <input type="text" id="immediateReward" placeholder="e.g., feel energized, enjoy fresh air" style="width: 100%; padding: 12px 16px; border: 2px solid #e5e7eb; border-radius: 12px; font-size: 16px;" />
      </div>
    </div>

    <!-- Milestones Section -->
    <div class="habit-section">
      <div class="section-header" onclick="toggleSection(this)" style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; padding: 12px; background: #f3f4f6; border-radius: 12px; margin-bottom: 12px;">
        <span style="font-weight: 700; color: #1f2937;">Milestones</span>
        <span class="section-toggle" style="font-size: 20px; transition: transform 0.3s;">▼</span>
      </div>
      <div class="section-content" style="display: flex; flex-direction: column; gap: 12px;">
        <div style="font-size: 12px; color: #6b7280; margin-bottom: 8px; font-weight: 600;">Track progress at key intervals</div>
        <div id="milestonesList" style="display: flex; flex-direction: column; gap: 12px;">
          <div class="milestone-item" style="display: flex; gap: 8px; align-items: center; padding: 12px; background: #dbeafe; border-radius: 12px; border: 2px solid #3b82f6;">
            <span style="font-size: 16px; font-weight: 600; color: #1e40af;">Day</span>
            <input type="number" class="milestone-days" placeholder="7" min="1" value="7" style="width: 60px; padding: 8px 12px; border: 2px solid #3b82f6; border-radius: 8px; font-size: 14px; font-weight: 600; text-align: center; background: white;" />
            <span style="font-size: 16px; font-weight: 600; color: #1e40af;">-</span>
            <input type="text" class="milestone-text" placeholder="first week complete" style="flex: 1; padding: 8px 12px; border: 2px solid #3b82f6; border-radius: 8px; font-size: 14px; background: white;" />
            <button type="button" class="remove-milestone" onclick="removeMilestone(this)" style="padding: 6px 10px; background: #fee2e2; color: #dc2626; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;">×</button>
          </div>
        </div>
        <button type="button" id="addMilestoneBtn" onclick="addMilestoneField()" style="width: 100%; padding: 12px; border: 2px dashed #3b82f6; background: transparent; color: #3b82f6; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px;">📈 Add Milestone</button>
      </div>
    </div>

    <button type="submit" id="submitHabitBtn" style="width: 100%; padding: 16px; border: none; background: linear-gradient(135deg, #10b981, #059669); color: white; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); margin-top: 12px;">Create Atomic Habit</button>
  </form>
</div>
